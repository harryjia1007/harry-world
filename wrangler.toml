name = "harry-world"
compatibility_date = "2026-01-01"
main = "worker.js"

routes = [
  { pattern = "harryjia.com", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
# 預設靜態檔案會直接由資產伺服器回應、不經過 Worker，統計就收不到資料。
# 開啟後所有請求先進 Worker（worker.js 只記 HTML 頁面，其餘照常轉給 ASSETS）。
run_worker_first = true

[[kv_namespaces]]
binding = "STATS"
id = "4acd0d6cba004a6ab65f4eb0acc2c577"

# 機車拍賣資料擷取排程。2026-08-22：dry-run 已解除，自動寫入正式啟用。
# 併存安全性已就緒（在拿掉 dry-run 前完成）：
#   - 惜物網：列表頁擷取剝除 DETAIL_PAGE_OWNED_FIELDS（能否領牌／廠牌型號等），
#     merge-duplicates 只更新 payload 有的欄位 → 不會覆蓋既有管線人工填好的深度欄位。
#   - 司法院：以「法院|年度|案號」簽章跟既有人工核對案件去重（見 judicial-opendata.js），
#     避免新舊 id 格式不同造成同案件重複。
#   - 車牌 30 天自動下架：purgeExpiredPlates 現在會真的執行（先前 dry-run 只印 log）。
#   */30 * * * * → 惜物網（擷取 + 詳情頁補欄位）
#   17 3 * * *   → 司法院開放資料（每週更新的來源）+ 車牌 30 天自動下架
#
# 2026-08-26：惜物網頻率從 */3 降到 */30。Cloudflare 寄信警告 KV 每日寫入額度
# （免費層 1,000 次/天）用到 90%，查出來是這條排程——shwoo 封鎖資料中心 IP，
# 每次都 guaranteed 失敗（見 HANDOFF 第 8 節，實際更新改走 ingestion/run-local.mjs
# 在台灣 IP 上跑），每 3 分鐘打一次純粹是浪費，一天 480 次無意義嘗試。改 30 分鐘一次：
# 萬一哪天 shwoo 對 Cloudflare 解封還是抓得到，只是慢一點發現，不影響真正的更新管道。
[triggers]
crons = ["*/30 * * * *", "17 3 * * *"]

[vars]
# "0"＝正式寫入；改回 "1" 可隨時退回只印 log 不寫入的安全模式。
INGESTION_DRY_RUN = "0"
