name = "harry-world"
compatibility_date = "2026-01-01"
main = "worker.js"

routes = [
  { pattern = "harryjia.com", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
# 預設靜態檔案會直接由資產伺服器回應、不經過 Worker，統計就收不到資料。
# 開啟後所有請求先進 Worker（worker.js 只記 HTML 頁面，其餘照常轉給 ASSETS）。
run_worker_first = true

[[kv_namespaces]]
binding = "STATS"
id = "4acd0d6cba004a6ab65f4eb0acc2c577"

# 機車拍賣資料擷取排程。2026-08-20 現況：Harry 用 ChatGPT 手動核對維護的既有管線
# 仍是主要資料來源，且用同一套 shwoo id 命名（shwoo-<AUID>），不能讓這裡的新程式碼
# 寫入真資料去覆蓋它。所以排程重新開啟，但 INGESTION_DRY_RUN=1（見下方 [vars]）讓
# 三個寫入函式（見 ingestion/supabase.js）全部只印 log、不觸碰資料庫——目的單純是
# 驗證 Cloudflare 的網路連不連得到這些政府網站、解析邏輯對不對，不是要開始寫入。
# 等連線與解析都驗證過、且跟舊管線的併存方式談清楚後，才把 INGESTION_DRY_RUN 拿掉。
#   */3 * * * *  → 惜物網
#   17 3 * * *   → 司法院開放資料 + 車牌 30 天自動下架（dry-run 下這條也只印 log）
[triggers]
crons = ["*/3 * * * *", "17 3 * * *"]

[vars]
INGESTION_DRY_RUN = "1"
